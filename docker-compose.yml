services:
  rustfs:
    image: rustfs/rustfs:latest
    container_name: lab3-rustfs
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-LAB3ACCESSKEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-Lab3SecretKeyChangeMe2026}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_OBS_LOGGER_LEVEL: error
      # Docker Desktop presents named volumes on one virtual block device.
      # Safe only for this local laboratory; never use this bypass in production.
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
    volumes:
      - rustfs-disk1:/data1
      - rustfs-disk2:/data2
      - rustfs-disk3:/data3
      - rustfs-disk4:/data4
    command: ["/data1", "/data2", "/data3", "/data4"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 3s
      timeout: 2s
      retries: 30

volumes:
  rustfs-disk1:
  rustfs-disk2:
  rustfs-disk3:
  rustfs-disk4:
